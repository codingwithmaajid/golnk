[project]
name = "url-shortner"
version = "0.1.0"
description = "A simple URL shortener built with Python, FastAPI, PostgreSQL, and Valkey"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "redis",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]
